name: Build source-only APK (no MFi)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(awk -F'"' '/versionName = / {print $2; exit}' mobile/build.gradle.kts)
          CODE=$(awk '/versionCode = / {print $3; exit}' mobile/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION ($CODE), source-only"

      - name: Prepare AOSP platform test key
        run: |
          KEYDIR="$RUNNER_TEMP/platform-key"
          mkdir -p "$KEYDIR"
          BASE="https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security"
          curl -sSL "$BASE/platform.pk8?format=TEXT" | base64 -d > "$KEYDIR/platform.pk8"
          curl -sSL "$BASE/platform.x509.pem?format=TEXT" | base64 -d > "$KEYDIR/platform.x509.pem"
          openssl pkey -inform DER -in "$KEYDIR/platform.pk8" -out "$KEYDIR/platform.key"
          openssl pkcs12 -export -in "$KEYDIR/platform.x509.pem" -inkey "$KEYDIR/platform.key" -name platform -out "$KEYDIR/platform.p12" -passout pass:android
          keytool -importkeystore -srckeystore "$KEYDIR/platform.p12" -srcstoretype PKCS12 -srcstorepass android -destkeystore "$KEYDIR/platform.jks" -deststoretype JKS -deststorepass android -destkeypass android -alias platform -noprompt
          echo "ANDROID_KEYSTORE_PATH=$KEYDIR/platform.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=platform" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :mobile:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -x lintVitalReportRelease --stacktrace

      - name: Verify, reject MFi assets, collect artifact
        id: artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_SRC=mobile/build/outputs/apk/release/mobile-release.apk
          OUT=out
          mkdir -p "$OUT"
          APK="$OUT/DiPlay-lynk-$VERSION-source-only.apk"
          /bin/cp -f "$APK_SRC" "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" dump badging "$APK" | head -3
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          if unzip -l "$APK" | grep -q 'assets/offline-mfi'; then
            echo "::error::MFi identity found in a public CI artifact; refusing to upload"
            exit 1
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  DiPlay-lynk-$VERSION-source-only.apk" > "$OUT/SHA256SUMS.txt"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          cat "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-lynk-${{ steps.version.outputs.version }}-source-only
          path: out/*
